<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Artittaya Portfolio</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><main class="admin-shell"><section id="loginGate" class="admin-card"><p class="eyebrow">SECURE ADMIN</p><h1>เข้าสู่ระบบผู้ดูแล</h1><form id="loginForm"><label>อีเมล<input id="email" type="email" required></label><label>รหัสผ่าน<input id="password" type="password" required></label><button class="btn primary">เข้าสู่ระบบ</button><p id="loginError"></p></form></section><div id="adminApp" hidden><header class="admin-top"><div><p class="eyebrow">CONTENT MANAGEMENT</p><h1>Portfolio Admin</h1></div><div><a class="btn" href="index.html">ดูเว็บไซต์</a> <button id="logoutBtn" class="btn">ออกจากระบบ</button></div></header><section class="admin-grid"><form id="workForm" class="admin-card"><h2 id="formTitle">เพิ่มผลงานใหม่</h2><input id="workId" type="hidden"><label>ชื่อผลงาน<input id="title" required></label><div class="two"><label>ปี พ.ศ.<input id="year" type="number" value="2569" required></label><label>หมวดหมู่<input id="category" required></label></div><label>รายละเอียด<textarea id="description" rows="5"></textarea></label><label>อัปโหลดรูปภาพ<input id="imageFile" type="file" accept="image/*"></label><label>หรือ URL รูปภาพ<input id="imageUrl" type="url"></label><label>ลิงก์เอกสาร / Drive<input id="linkUrl" type="url"></label><label>สถานะ<select id="status"><option value="published">เผยแพร่</option><option value="draft">ฉบับร่าง</option><option value="hidden">ซ่อน</option></select></label><button class="btn primary">บันทึก</button> <button type="button" id="cancelEdit" class="btn">ล้างฟอร์ม</button></form><section class="admin-card"><h2>รายการผลงาน</h2><div id="adminList" class="admin-list"></div></section></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="data-service.js"></script><script src="admin.js"></script></body></html>

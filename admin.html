<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Artittaya Portfolio</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body class="admin-body"><main class="admin-shell"><section id="loginGate" class="admin-card login-card"><p class="eyebrow">SECURE ADMIN</p><h1>เข้าสู่ระบบผู้ดูแล</h1><form id="loginForm"><label>อีเมล<input id="email" type="email" required></label><label>รหัสผ่าน<input id="password" type="password" required></label><button class="btn primary">เข้าสู่ระบบ</button><p id="loginError"></p></form></section><div id="adminApp" hidden><header class="admin-top"><div><p class="eyebrow">CONTENT MANAGEMENT • V4</p><h1>Portfolio Admin</h1><p class="muted">จัดการผลงาน รูปภาพ เอกสาร และสถานะการเผยแพร่</p></div><div class="admin-actions"><a class="btn" href="index.html">ดูเว็บไซต์ ↗</a><button id="logoutBtn" class="btn">ออกจากระบบ</button></div></header><section class="admin-stats"><article><span>ผลงานทั้งหมด</span><b id="totalStat">0</b></article><article><span>เผยแพร่</span><b id="pubStat">0</b></article><article><span>ฉบับร่าง/ซ่อน</span><b id="draftStat">0</b></article><article><span>ปีล่าสุด</span><b id="yearStat">–</b></article></section><section class="admin-toolbar"><input id="adminSearch" placeholder="ค้นหาชื่อผลงาน หมวดหมู่ หรือรายละเอียด…"><select id="adminYear"><option value="all">ทุกปี</option></select><select id="adminStatus"><option value="all">ทุกสถานะ</option><option value="published">เผยแพร่</option><option value="draft">ฉบับร่าง</option><option value="hidden">ซ่อน</option></select></section><section class="admin-grid"><form id="workForm" class="admin-card editor"><div class="form-heading"><div><p class="eyebrow">EDITOR</p><h2 id="formTitle">เพิ่มผลงานใหม่</h2></div><span id="editBadge" class="badge" hidden>กำลังแก้ไข</span></div><input id="workId" type="hidden"><label>ชื่อผลงาน<input id="title" required placeholder="เช่น อบรมการพัฒนาศักยภาพครู..."></label><div class="two"><label>ปี พ.ศ.<input id="year" type="number" value="2569" required></label><label>หมวดหมู่<select id="category" required><option value="">เลือกหมวดหมู่</option><option>การจัดการเรียนรู้</option><option>ดูแลผู้เรียน</option><option>พัฒนาวิชาชีพ</option><option>พัฒนาสถานศึกษา</option><option>กิจกรรม</option><option>PA</option><option>วิจัย</option><option>รางวัล/เกียรติบัตร</option></select></label></div><label>วันที่กิจกรรม<input id="eventDate" type="date"></label><label>รายละเอียด<textarea id="description" rows="5" placeholder="สรุปบทบาท ผลลัพธ์ หรือสาระสำคัญ"></textarea></label><label class="dropzone">อัปโหลดรูปภาพ<input id="imageFile" type="file" accept="image/*"><span>เลือกรูป JPG / PNG / WEBP</span></label><div id="imagePreview" class="image-preview" hidden></div><label>หรือ URL รูปภาพ<input id="imageUrl" type="url" placeholder="https://..."></label><label>ลิงก์เอกสาร / Google Drive<input id="linkUrl" type="url" placeholder="https://..."></label><label>สถานะ<select id="status"><option value="published">เผยแพร่</option><option value="draft">ฉบับร่าง</option><option value="hidden">ซ่อน</option></select></label><div class="form-buttons"><button class="btn primary">บันทึกข้อมูล</button><button type="button" id="cancelEdit" class="btn">ล้างฟอร์ม</button></div><p id="saveMessage" class="muted"></p></form><section class="admin-card list-panel"><div class="list-heading"><div><p class="eyebrow">CONTENT LIBRARY</p><h2>รายการผลงาน</h2></div><span id="resultCount" class="badge"></span></div><div id="adminList" class="admin-list"></div></section></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="data-service.js"></script><script src="admin.js"></script></body></html>
